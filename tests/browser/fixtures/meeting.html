<!doctype html>
<html lang="en"><title>Synthetic Zoom contract</title><body>
<main data-testid="meeting-client">
  <section id="participants-panel" aria-label="Participants">
    <div data-testid="participants-item" role="listitem">
      <span data-testid="display-name">Test Participant</span>
    </div>
  </section>
  <div data-testid="video-tile"><span data-testid="display-name">Test Participant</span></div>
