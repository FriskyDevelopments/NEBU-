<!doctype html><html lang="en"><title>Synthetic selector states, not a live Zoom capture</title><body>
<div data-testid="meeting-client" id="wc-container-left"></div>
<div data-testid="prejoin"></div><div data-testid="meeting-ended"></div>
<section id="participants-panel"><div data-testid="participants-item"><span data-testid="display-name" class="participants-item__display-name">Test Participant</span><button aria-label="More">More</button><button aria-label="Mute">Mute</button></div></section>
<div data-testid="video-tile"><span data-testid="display-name">Test Participant</span><span aria-label="Hand Raised"></span><span aria-label="camera off"></span></div>
<section aria-label="Waiting Room"><button aria-label="Admit">Admit</button><button aria-label="Admit all">Admit all</button></section>
<div role="menu"><button role="menuitem">Pin</button><button role="menuitem">Multi-pin</button><button role="menuitem">Unpin</button><button role="menuitem">Remove</button><button role="menuitem">Mute</button></div>
<section id="chat-panel"><span class="chat-message__text">Synthetic message</span><span class="chat-message__sender">Test Participant</span></section>
<footer id="wc-footer"><button aria-label="Leave">Leave</button><button aria-label="End meeting for all">End meeting for all</button></footer>
<span data-testid="host-badge">Host</span><span data-testid="cohost-badge">Co-host</span>
</body></html>
